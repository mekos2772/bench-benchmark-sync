# Today model feed sources. All external requests run in GitHub Actions only.
#
# Two channels, both carry concrete model parameters:
#   1. hub_orgs: vendor official Hugging Face organizations -> open-weight releases
#      (parameter count, license, context window, modalities from the model repo itself)
#   2. openrouter: public model catalog -> closed-source API models
#      (context window, pricing, modalities, capabilities)
#
# No GitHub repository activity, no generic "newest on the Hub" discovery.
hub_orgs:
  - {org: Qwen, provider: Qwen}
  - {org: deepseek-ai, provider: DeepSeek}
  - {org: meta-llama, provider: Meta}
  - {org: mistralai, provider: Mistral AI}
  - {org: google, provider: Google}
  - {org: microsoft, provider: Microsoft}
  - {org: nvidia, provider: NVIDIA}
  - {org: openai, provider: OpenAI}
  - {org: xai-org, provider: xAI}
  - {org: moonshotai, provider: Moonshot AI}
  - {org: zai-org, provider: Z.ai}
  - {org: MiniMaxAI, provider: MiniMax}
  - {org: tencent, provider: Tencent}
  - {org: ByteDance-Seed, provider: ByteDance}
  - {org: baidu, provider: Baidu}
  - {org: 01-ai, provider: 01.AI}
  - {org: internlm, provider: InternLM}
  - {org: inclusionAI, provider: InclusionAI}
  - {org: stepfun-ai, provider: StepFun}
  - {org: ibm-granite, provider: IBM}
  - {org: allenai, provider: Allen AI}
  - {org: tiiuae, provider: TII}
  - {org: black-forest-labs, provider: Black Forest Labs}
  - {org: stabilityai, provider: Stability AI}
  - {org: Lightricks, provider: Lightricks}
  - {org: Wan-AI, provider: Alibaba Wan}
  - {org: openbmb, provider: OpenBMB}
  - {org: CohereLabs, provider: Cohere}
  - {org: XiaomiMiMo, provider: Xiaomi}

openrouter:
  enabled: true
  providers:
    openai: OpenAI
    anthropic: Anthropic
    google: Google
    x-ai: xAI
    mistralai: Mistral AI
    deepseek: DeepSeek
    qwen: Qwen
    z-ai: Z.ai
    moonshotai: Moonshot AI
    minimax: MiniMax
    meta-llama: Meta
    meta: Meta
    nvidia: NVIDIA
    microsoft: Microsoft
    amazon: Amazon
    cohere: Cohere
    tencent: Tencent
    bytedance-seed: ByteDance
    baidu: Baidu
    inclusionai: InclusionAI
    stepfun: StepFun
    perplexity: Perplexity
    ai21: AI21 Labs
    ibm-granite: IBM
    liquid: Liquid AI
    upstage: Upstage
    reka: Reka AI
    inception: Inception
    thinkingmachines: Thinking Machines
    poolside: Poolside
    nex-agi: Nex AGI
    aion-labs: Aion Labs

settings:
  window_hours: 24
  max_events: 200
  max_hub_events: 40
  catalog_max_models: 40
  hub_org_limit: 20
  hub_timeout_seconds: 30
  openrouter_timeout_seconds: 30
  # GitHub only runs the */5 schedule every 2-5 hours in practice, so a tighter
  # threshold would flag a healthy pipeline as delayed most of the day.
  stale_after_minutes: 360
  hub_denied_name_tokens:
    - adapter
    - lora
    - controlnet
    - embedding
    - quantized
    - quantisation
    - quantization
    - gguf
    - test
    - demo
    - tmp
    - scratch
    - mirror
    - merge
    - checkpoint
    - checkpoints
    - supplemental
    - tokenizer
