sources:
  - benchmark_id: swebench
    status: enabled
    source_name: SWE-bench official leaderboard JSON
    organization: SWE-bench
    source_type: official_github_raw
    official_url: https://www.swebench.com/
    endpoint: https://raw.githubusercontent.com/SWE-bench/swe-bench.github.io/master/data/leaderboards.json
    fetch_method: GET
    update_frequency: weekly_or_release
    requires_auth: false
    evidence_url: https://github.com/SWE-bench/swe-bench.github.io/blob/master/data/leaderboards.json
    release_tracking: board.name_and_result.folder
    hash_required: true
