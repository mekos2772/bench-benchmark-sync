name: today-activity

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Collect and build Today feed
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          MAIN_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p generated/static-events
          python scripts/build_today_events.py \
            --output-dir generated/static-events \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --main-commit "$MAIN_COMMIT"
      - name: Verify Today feed
        run: node scripts/verify_today_events.js generated/static-events/today-events.json generated/static-events/today-events.js
      - name: Publish verified Today feed
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/static-events/today-events.json generated/static-events/today-events.js generated/static-events/today-state.json
          if git diff --cached --quiet; then
            echo "No Today activity changes"
            exit 0
          fi
          git commit -m "Update Today activity feed (run ${WORKFLOW_RUN_ID})"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Push Today feed to WeChat CloudBase
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APP_SECRET: ${{ secrets.WX_APP_SECRET }}
          WX_CLOUD_ENV: ${{ secrets.WX_CLOUD_ENV }}
        run: |
          set -euo pipefail
          if [ -z "$WX_APPID" ] || [ -z "$WX_APP_SECRET" ] || [ -z "$WX_CLOUD_ENV" ]; then
            echo "::warning::CloudBase push skipped: set WX_APPID / WX_APP_SECRET / WX_CLOUD_ENV repository secrets"
            exit 0
          fi
          python scripts/push_today_feed.py --feed generated/static-events/today-events.json
