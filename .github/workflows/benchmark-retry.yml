name: benchmark-retry

on:
  workflow_run:
    workflows: ["benchmark-sync"]
    types: [completed]
  workflow_dispatch:
    inputs:
      benchmark:
        description: "One or more enabled benchmark ids separated by spaces"
        required: true
        type: string
      max_attempts:
        description: "Maximum attempts per benchmark, capped at 2"
        required: false
        default: "2"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-retry-${{ github.ref }}-${{ inputs.benchmark || github.run_id }}
  cancel-in-progress: false

jobs:
  retry:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Select only failed collectors from the upstream run
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_BENCHMARK: ${{ inputs.benchmark }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_BENCHMARK:-}" ]; then
            benchmark_list="$INPUT_BENCHMARK"
          else
            benchmark_list="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure") | .name | select(startswith("sync (") and endswith(")")) | .[6:-1]' \
              | sort -u | tr '\n' ' ')"
          fi
          if [ -n "$benchmark_list" ]; then
            python -m collector.ci_matrix --kind enabled --benchmark "$benchmark_list" >/dev/null
          else
            echo "No failed collector jobs to retry"
          fi
          echo "benchmarks=$benchmark_list" >> "$GITHUB_OUTPUT"
      - name: Retry selected collectors
        if: steps.targets.outputs.benchmarks != ''
        env:
          INGESTION_URL: ${{ secrets.INGESTION_URL }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
          BENCHMARK_LIST: ${{ steps.targets.outputs.benchmarks }}
          INPUT_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        run: |
          set +e
          attempts="${INPUT_MAX_ATTEMPTS:-2}"
          case "$attempts" in 1|2) ;; *) attempts=2 ;; esac
          overall=0
          for benchmark in $BENCHMARK_LIST; do
            succeeded=0
            for attempt in $(seq 1 "$attempts"); do
              python -m collector.runner --benchmark "$benchmark" --output-dir artifacts --ingest
              status=$?
              if [ "$status" -eq 0 ]; then succeeded=1; break; fi
              sleep $((attempt * 5))
            done
            if [ "$succeeded" -ne 1 ]; then overall=1; fi
          done
          exit "$overall"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-retry-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
