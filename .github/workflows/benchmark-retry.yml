name: benchmark-retry

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "One or more enabled benchmark ids separated by spaces"
        required: true
        type: string
      max_attempts:
        description: "Maximum attempts per benchmark, capped at 2"
        required: false
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-retry-${{ github.ref }}-${{ inputs.benchmark || github.run_id }}
  cancel-in-progress: false

jobs:
  retry:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Validate selected collectors
        id: targets
        env:
          INPUT_BENCHMARK: ${{ inputs.benchmark }}
        run: |
          set -euo pipefail
          benchmark_list="$(python -m collector.ci_matrix --kind enabled --benchmark "$INPUT_BENCHMARK" | jq -r 'join(" ")')"
          echo "benchmarks=$benchmark_list" >> "$GITHUB_OUTPUT"
      - name: Retry selected collectors
        if: steps.targets.outputs.benchmarks != ''
        env:
          BENCHMARK_LIST: ${{ steps.targets.outputs.benchmarks }}
          INPUT_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        run: |
          set -euo pipefail
          attempts="${INPUT_MAX_ATTEMPTS:-2}"
          case "$attempts" in 1|2) ;; *) attempts=2 ;; esac
          overall=0
          for benchmark in $BENCHMARK_LIST; do
            python -m collector.runner --benchmark "$benchmark" --output-dir artifacts --attempts "$attempts" || overall=1
          done
          exit "$overall"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-retry-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
