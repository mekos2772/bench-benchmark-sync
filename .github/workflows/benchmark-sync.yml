name: benchmark-sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Optional enabled benchmark id; set it for single-source diagnostics (full export runs only when empty)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-sync-${{ github.ref }}-${{ inputs.benchmark || 'enabled' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      benchmarks: ${{ steps.matrix.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - id: matrix
        env:
          INPUT_BENCHMARK: ${{ inputs.benchmark }}
        run: |
          set -euo pipefail
          python -m collector.ci_matrix --kind enabled --benchmark "${INPUT_BENCHMARK:-}" > /tmp/benchmarks.json
          cat /tmp/benchmarks.json
          echo "benchmarks=$(cat /tmp/benchmarks.json)" >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        benchmark: ${{ fromJSON(needs.prepare.outputs.benchmarks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run selected collector
        run: python -m collector.runner --benchmark "${{ matrix.benchmark }}" --output-dir artifacts
      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sync-snapshot-${{ matrix.benchmark }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore

  export:
    needs: sync
    if: ${{ !cancelled() && (inputs.benchmark == '' || inputs.benchmark == null) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Download snapshot artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-sync-snapshot-*-${{ github.run_id }}
          path: artifacts
          merge-multiple: true
      - name: Validate static export
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          MAIN_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m exporter.cli \
            --snapshot-root artifacts \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --main-commit "$MAIN_COMMIT" \
            --check | tee /tmp/export-check.json
          python - /tmp/export-check.json <<'PY'
          import json
          import sys

          result = json.load(open(sys.argv[1], encoding='utf-8'))
          expected_families = ['livebench', 'aa', 'deepswe']
          if result.get('families') != expected_families or result.get('boards') != 24:
              raise SystemExit(f'incomplete static export: {result}')
          PY
      - name: Write static export artifact
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          MAIN_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m exporter.cli \
            --snapshot-root artifacts \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --main-commit "$MAIN_COMMIT" \
            --output-dir static-export
      - name: Verify static export files
        run: node scripts/verify_static_export.js \
          static-export/livebench-ranking.json \
          static-export/livebench-ranking.js \
          24 \
          "${{ github.run_id }}" \
          "${{ github.sha }}"
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sync-static-export-${{ github.run_id }}
          path: static-export/
          if-no-files-found: error
