name: benchmark-sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Optional benchmark id; empty runs all enabled sources"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-sync-${{ github.ref }}-${{ inputs.benchmark || 'enabled' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark: [swebench, swebench_verified]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run selected collector
        env:
          INGESTION_URL: ${{ secrets.INGESTION_URL }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
          INPUT_BENCHMARK: ${{ inputs.benchmark }}
        run: |
          set -euo pipefail
          benchmark="${INPUT_BENCHMARK:-${{ matrix.benchmark }}}"
          if [ "$benchmark" = "${{ matrix.benchmark }}" ] || [ -z "${INPUT_BENCHMARK:-}" ]; then
            python -m collector.runner --benchmark "$benchmark" --output-dir artifacts --ingest
          else
            exit 0
          fi
      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sync-${{ matrix.benchmark }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
