name: benchmark-sync

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'exporter/**'
      - 'persistence/**'
      - 'config/sources.yaml'
      - 'config/benchmark_hierarchy.yaml'
      - 'tests/**'
      - '.github/workflows/benchmark-sync.yml'
      - '.github/workflows/benchmark-retry.yml'
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Optional enabled benchmark id; set it for single-source diagnostics (full export runs only when empty)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-sync-${{ github.ref }}-${{ inputs.benchmark || 'enabled' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      benchmarks: ${{ steps.matrix.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Test version and export contracts
        run: python -m pytest -q tests/test_artificial_analysis.py tests/test_exporter.py tests/test_registry.py tests/test_retry_policy.py tests/test_ci_matrix.py tests/test_schema.py
      - id: matrix
        env:
          INPUT_BENCHMARK: ${{ inputs.benchmark }}
        run: |
          set -euo pipefail
          python -m collector.ci_matrix --kind enabled --benchmark "${INPUT_BENCHMARK:-}" > /tmp/benchmarks.json
          cat /tmp/benchmarks.json
          echo "benchmarks=$(cat /tmp/benchmarks.json)" >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        benchmark: ${{ fromJSON(needs.prepare.outputs.benchmarks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run selected collector
        run: python -m collector.runner --benchmark "${{ matrix.benchmark }}" --output-dir artifacts --attempts 3
      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sync-snapshot-${{ matrix.benchmark }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore

  export:
    needs: [prepare, sync]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.prepare.result == 'success' && (inputs.benchmark == '' || inputs.benchmark == null) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Read last published benchmark export
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: benchmark-data
          path: previous-benchmark-data
          persist-credentials: false
      - name: Download snapshot artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-sync-snapshot-*-${{ github.run_id }}
          path: artifacts
          merge-multiple: true
      - name: Validate static export
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          MAIN_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m exporter.cli \
            --snapshot-root artifacts \
            --previous-export previous-benchmark-data/generated/static-export/livebench-ranking.json \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --main-commit "$MAIN_COMMIT" \
            --check | tee /tmp/export-check.json
          python - /tmp/export-check.json <<'PY'
          import json
          import sys

          result = json.load(open(sys.argv[1], encoding='utf-8'))
          expected_families = ['livebench', 'aa', 'deepswe']
          if result.get('families') != expected_families or result.get('boards') != 31:
              raise SystemExit(f'incomplete static export: {result}')
          PY
      - name: Write static export artifact
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          MAIN_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m exporter.cli \
            --snapshot-root artifacts \
            --previous-export previous-benchmark-data/generated/static-export/livebench-ranking.json \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --main-commit "$MAIN_COMMIT" \
            --output-dir static-export
      - name: Verify static export files
        run: |
          node scripts/verify_static_export.js \
            static-export/livebench-ranking.json \
            static-export/livebench-ranking.js \
            31 \
            "${{ github.run_id }}" \
            "${{ github.sha }}"
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sync-static-export-${{ github.run_id }}
          path: static-export/
          if-no-files-found: error

  publish-data:
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-sync-static-export-${{ github.run_id }}
          path: static-export
      - name: Verify static export files
        run: |
          node scripts/verify_static_export.js \
            static-export/livebench-ranking.json \
            static-export/livebench-ranking.js \
            31 \
            "${{ github.run_id }}" \
            "${{ github.sha }}"
      - name: Publish verified static export to data branch
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          MAIN_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p generated/static-export
          cp static-export/livebench-ranking.json generated/static-export/livebench-ranking.json
          cp static-export/livebench-ranking.js generated/static-export/livebench-ranking.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/static-export/livebench-ranking.json generated/static-export/livebench-ranking.js
          if git diff --cached --quiet; then
            echo "No generated static export changes"
            exit 0
          fi
          git commit -m "Update static benchmark export (run ${WORKFLOW_RUN_ID}, commit ${MAIN_COMMIT})"
          git push origin HEAD:refs/heads/benchmark-data --force
