name: benchmark-sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Optional enabled benchmark id; empty runs all enabled sources"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-sync-${{ github.ref }}-${{ inputs.benchmark || 'enabled' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      benchmarks: ${{ steps.matrix.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - id: matrix
        env:
          INPUT_BENCHMARK: ${{ inputs.benchmark }}
        run: |
          set -euo pipefail
          python -m collector.ci_matrix --kind enabled --benchmark "${INPUT_BENCHMARK:-}" > /tmp/benchmarks.json
          cat /tmp/benchmarks.json
          echo "benchmarks=$(cat /tmp/benchmarks.json)" >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark: ${{ fromJSON(needs.prepare.outputs.benchmarks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run selected collector
        env:
          INGESTION_URL: ${{ secrets.INGESTION_URL }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
        run: python -m collector.runner --benchmark "${{ matrix.benchmark }}" --output-dir artifacts --ingest
      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sync-${{ matrix.benchmark }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
