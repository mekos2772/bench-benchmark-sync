name: benchmark-reconcile

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Optional benchmark id"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-reconcile-${{ github.ref }}-${{ inputs.benchmark || 'weekly' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark: [livebench, swebench, swebench_verified, terminalbench]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Check source status without guessing endpoints
        env:
          INPUT_BENCHMARK: ${{ inputs.benchmark }}
        run: |
          set -euo pipefail
          benchmark="${INPUT_BENCHMARK:-${{ matrix.benchmark }}}"
          if [ "$benchmark" = "${{ matrix.benchmark }}" ] || [ -z "${INPUT_BENCHMARK:-}" ]; then
            python -m collector.runner --benchmark "$benchmark" --output-dir artifacts
          else
            exit 0
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reconcile-${{ matrix.benchmark }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
