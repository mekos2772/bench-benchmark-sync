name: benchmark-reconcile

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Optional benchmark hierarchy id; empty checks all nodes"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-reconcile-${{ github.ref }}-${{ inputs.benchmark || 'hierarchy' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      benchmarks: ${{ steps.matrix.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - id: matrix
        env:
          INPUT_BENCHMARK: ${{ inputs.benchmark }}
        run: |
          set -euo pipefail
          python -m collector.ci_matrix --kind hierarchy --benchmark "${INPUT_BENCHMARK:-}" > /tmp/benchmarks.json
          cat /tmp/benchmarks.json
          echo "benchmarks=$(cat /tmp/benchmarks.json)" >> "$GITHUB_OUTPUT"

  reconcile:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark: ${{ fromJSON(needs.prepare.outputs.benchmarks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Check source status without guessing endpoints
        run: python -m collector.runner --benchmark "${{ matrix.benchmark }}" --output-dir artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reconcile-${{ matrix.benchmark }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
