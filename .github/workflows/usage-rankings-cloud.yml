name: Publish usage rankings to CloudBase

on:
  schedule:
    # Run from the trusted default branch; GitHub scheduled jobs can be delayed.
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usage-rankings-cloud
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Download public usage document
        run: |
          set -euo pipefail
          mkdir -p generated/usage-rankings
          curl --fail --silent --show-error --location --retry 3 --max-time 20 \
            --output generated/usage-rankings/usage-rankings.json \
            https://raw.githubusercontent.com/mekos2772/bench-benchmark-sync/usage-data/generated/usage-rankings/usage-rankings.json
      - name: Validate usage document
        run: python scripts/push_today_feed.py --kind usage --dry-run
      - name: Publish usage document
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APP_SECRET: ${{ secrets.WX_APP_SECRET }}
          WX_CLOUD_ENV: ${{ secrets.WX_CLOUD_ENV }}
        run: |
          set -euo pipefail
          if [ -z "$WX_APPID" ] || [ -z "$WX_APP_SECRET" ] || [ -z "$WX_CLOUD_ENV" ]; then
            echo "::error::Set WX_APPID, WX_APP_SECRET, and WX_CLOUD_ENV repository secrets"
            exit 1
          fi
          python scripts/push_today_feed.py --kind usage
