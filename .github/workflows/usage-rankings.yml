name: usage-rankings

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: usage-rankings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Collect daily usage rankings
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p generated/usage-rankings
          python scripts/usage_rankings.py --output generated/usage-rankings/usage-rankings.json
      - name: Push usage rankings to WeChat CloudBase
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APP_SECRET: ${{ secrets.WX_APP_SECRET }}
          WX_CLOUD_ENV: ${{ secrets.WX_CLOUD_ENV }}
        run: |
          set -euo pipefail
          if [ -z "$WX_APPID" ] || [ -z "$WX_APP_SECRET" ] || [ -z "$WX_CLOUD_ENV" ]; then
            echo "::warning::CloudBase push skipped: set WX_APPID / WX_APP_SECRET / WX_CLOUD_ENV repository secrets"
            exit 0
          fi
          python scripts/push_today_feed.py \
            --kind usage \
            --feed generated/usage-rankings/usage-rankings.json
